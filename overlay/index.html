<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Only load our own files; only open a WebSocket to the local backend (see src/protocol.ts). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws://127.0.0.1:8765"
    />
    <title>Companion</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111418;
        --text: #f2f4f7;
        --muted: #9aa4b2;
        --accent: #6ea8fe;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      .drag-bar {
        -webkit-app-region: drag; /* lets you move the frameless window by this bar */
        padding: 8px 12px;
        font-size: 13px;
        color: var(--muted);
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .orb {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #b9d4ff, var(--accent) 60%, #2b4a7a);
      }
      #status {
        margin: 0;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <header class="drag-bar">Companion</header>
    <main>
      <div class="orb" aria-hidden="true"></div>
      <p id="status" role="status">Idle</p>
      <!--
        TODO(exp2): transcript, step log, confirm prompt (big Yes / No buttons), text input.
        The renderer script needs a build choice: tsc outputs CommonJS (for main/preload),
        which won't run as a plain <script> in this page. Options: a bundler such as esbuild,
        or a separate tsconfig that outputs ES modules.
      -->
    </main>
  </body>
</html>
