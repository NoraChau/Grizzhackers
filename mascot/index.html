<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- connect-src must match WS_URL in protocol.js -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ws://127.0.0.1:8765"
    />
    <title>GrizzHelper</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main id="mascot" class="mascot" data-state="idle">
      <button id="close" class="close" type="button" title="Close GrizzHelper" aria-label="Close GrizzHelper">
        <span aria-hidden="true">×</span>
      </button>

      <div id="bubble" class="bubble" role="status" aria-live="polite">
        Hi! I'm GrizzHelper. What can I do for you?
      </div>

      <div id="confirm" class="confirm" hidden>
        <button id="confirm-yes" type="button">Yes</button>
        <button id="confirm-no" type="button">No</button>
      </div>

      <!-- TODO(Sarahi): replace the emoji with the bear art, e.g. <img src="assets/idle.png" alt="" /> -->
      <div id="bear" class="bear" aria-hidden="true">🐻</div>

      <div class="input-row">
        <input
          id="request"
          class="request"
          type="text"
          placeholder="Type here"
          autocomplete="off"
          aria-label="Request for GrizzHelper"
        />
        <!-- Same as pressing Enter in the box. -->
        <button id="send" class="row-btn" type="button" title="Send" aria-label="Send request">
          <span aria-hidden="true">↵</span>
          <span>Enter</span>
        </button>
        <!-- One click starts recording, the next click stops and sends it. -->
        <button id="mic" class="row-btn mic" type="button" aria-pressed="false" title="Start talking">
          <span class="mic-icon" aria-hidden="true">🎤</span>
          <span id="mic-label" class="mic-label">Talk</span>
        </button>
      </div>

      <p id="hint" class="hint">Press <kbd>F9</kbd> for speech to text</p>
    </main>

    <script src="protocol.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
